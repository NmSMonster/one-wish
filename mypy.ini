[mypy]
# Statyczne typowanie kodu produkcyjnego (backend/) — brama w CI obok pytest+ruff.
# Nie --strict (to byłby osobny, duży projekt), ale łapie realne klasy błędów:
# dostęp do None, niespójne typy, martwe gałęzie. Zielony mypy = kontrakt typów trzyma.
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True
